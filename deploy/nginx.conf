worker_processes 1;
events { worker_connections 1024; }
http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 80;
    server_name _;
    root D:/AIProject/campus-card-consultant/admin-web/dist;
    index index.html;
    location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_buffering off; }
    location / { try_files $uri $uri/ /index.html; }
  }
  server {
    listen 81;
    server_name _;
    root D:/AIProject/campus-card-consultant/mobile-web/dist;
    index index.html;
    location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_buffering off; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
